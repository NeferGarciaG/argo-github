apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-github-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/NeferGarciaG/argo-github.git
    targetRevision: main
    path: appsets
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
